<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>USB Bandwidth</title>
<style>
:root{--bg:#06090c;--text:#eef3f5;--muted:#8a969d;--a:#7ee8d8;--b:#c6b5e8;--c:#8fbaf0;--hub:#f4f8fa;--grid:rgba(255,255,255,.035);color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f1f4f7;--text:#0e1620;--muted:#5d6b78;--a:#0d9e8a;--b:#7557d6;--c:#2a74d6;--hub:#0e1620;--grid:rgba(15,25,40,.05);color-scheme:light}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{display:flex;flex-direction:column;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 10px);position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
 background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--c) 10%,transparent),transparent 60%),
 linear-gradient(var(--grid) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/40px 40px;
 -webkit-mask-image:radial-gradient(ellipse at center,#000 0%,transparent 80%);mask-image:radial-gradient(ellipse at center,#000 0%,transparent 80%)}
.head{position:relative;display:flex;justify-content:space-between;align-items:center;max-width:1000px;width:100%;margin:0 auto;padding:0 6px}
.title{font-size:12px;font-weight:700;letter-spacing:.22em;color:var(--muted)}
.st{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--muted)}
.st i{width:7px;height:7px;border-radius:50%;background:var(--a);box-shadow:0 0 12px var(--a);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.3}}
.box{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
svg{width:100%;height:100%;max-width:1000px;display:block}
text{font-family:inherit}
.u3{--k:var(--a)}.u2{--k:var(--b)}.w{--k:var(--c)}
.ty{font-size:11px;font-weight:800;letter-spacing:.16em;fill:var(--k)}
.md{font-size:12.5px;fill:var(--muted)}
.sp{font-size:21px;font-weight:600;font-family:"SF Mono",SFMono-Regular,Consolas,monospace;fill:var(--text);font-variant-numeric:tabular-nums}
.un{font-size:11px;font-weight:500;fill:var(--muted)}
.base{fill:none;stroke-width:2;stroke-linecap:round;opacity:.2}
.flow{fill:none;stroke-linecap:round;stroke-dasharray:2 11;animation:f 1s linear infinite;transition:stroke-width .8s,opacity .8s}
@keyframes f{to{stroke-dashoffset:-13}}
.pt{fill:var(--k);filter:drop-shadow(0 0 4px var(--k))}
.nd{fill:var(--bg);stroke:var(--k);stroke-width:2;animation:np 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes np{50%{transform:scale(1.25)}}
.wave{fill:none;stroke:var(--hub);stroke-opacity:.5;transform-box:fill-box;transform-origin:center;animation:w 2.2s ease-out infinite}
@keyframes w{from{transform:scale(1);opacity:.8}to{transform:scale(2.6);opacity:0}}
.out{fill:none;stroke:var(--hub);stroke-width:3;stroke-linecap:round;stroke-dasharray:2 11;animation:f .8s linear infinite;opacity:.85}
.cl{font-size:10.5px;font-weight:800;letter-spacing:.22em;fill:var(--muted)}
.cv{font-weight:700;font-family:"SF Mono",SFMono-Regular,Consolas,monospace;fill:var(--text);font-variant-numeric:tabular-nums}
.cg{font-size:12.5px;fill:var(--muted)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="head"><div class="title">USB BANDWIDTH</div><div class="st"><i></i>MULTI LINK ACTIVE</div></div>
<div class="box"><svg id="svg" role="img" aria-label="Bandwidth per link merging into combined total"></svg></div>

<script>
const links=[
 {cls:"u3",type:"USB 3.0",name:"Samsung Galaxy S23 Ultra 5G",v:720,min:300,max:1000},
 {cls:"u3",type:"USB 3.0",name:"Samsung Galaxy S24 Ultra 5G",v:840,min:300,max:1000},
 {cls:"u3",type:"USB 3.0",name:"Samsung Galaxy S25 Ultra 5G",v:910,min:300,max:1000},
 {cls:"u2",type:"USB 2.0",name:"POCO X6 5G",v:420,min:200,max:480},
 {cls:"u2",type:"USB 2.0",name:"Redmi Note 13 5G",v:380,min:200,max:480},
 {cls:"w",type:"WAN",name:"5G Network",v:620,min:200,max:1000}
];
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("svg"),fmt=n=>n.toLocaleString("en-US");
const CAP=links.reduce((s,l)=>s+l.max,0),RC=2*Math.PI*26,still=matchMedia("(prefers-reduced-motion:reduce)").matches;
let mode="",ui={};

const mk=(t,a,p=svg)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};

function build(){
 svg.innerHTML="";
 const tall=innerWidth/innerHeight<.85;
 mode=tall?"t":"w";
 const L=tall?{W:420,H:560,y0:48,dy:92,nx:190,mx:312,ox:405,end:414}:{W:960,H:470,y0:46,dy:75,nx:330,mx:668,ox:760,end:960};
 const MY=L.y0+L.dy*2.5;
 svg.setAttribute("viewBox",`0 0 ${L.W} ${L.H}`);
 const defs=mk("defs",{});
 links.forEach((l,i)=>{
  const y=L.y0+i*L.dy,g=mk("g",{class:l.cls});
  const gr=mk("linearGradient",{id:"g"+i,gradientUnits:"userSpaceOnUse",x1:L.nx,y1:y,x2:L.mx,y2:MY},defs);
  mk("stop",{offset:"0",style:"stop-color:var(--k)"},gr);mk("stop",{offset:"1",style:"stop-color:var(--hub)"},gr);
  const dx=(L.mx-L.nx)*.55,d=`M${L.nx} ${y} C${L.nx+dx} ${y} ${L.mx-dx} ${MY} ${L.mx-5} ${MY}`;
  mk("path",{id:"p"+i,class:"base",d,stroke:`url(#g${i})`},g);
  l.flow=mk("path",{class:"flow",d,stroke:`url(#g${i})`},g);
  if(!still)[0,1,2].forEach(n=>{
   const c=mk("circle",{class:"pt",r:2.6},g);
   const m=mk("animateMotion",{dur:"3s",begin:`-${(n+i*.37).toFixed(2)}s`,repeatCount:"indefinite"},c);
   mk("mpath",{href:"#p"+i},m);
  });
  mk("circle",{class:"nd",cx:L.nx,cy:y,r:6},g);
  mk("text",{class:"ty",x:0,y:y-20},g).textContent=l.type;
  mk("text",{class:"md",x:0,y:y-3},g).textContent=l.name;
  const t=mk("text",{class:"sp",x:0,y:y+22},g);
  l.sv=mk("tspan",{},t);l.su=mk("tspan",{class:"un",dx:5},t);l.su.textContent="Mbps";
 });
 // merge hub
 mk("circle",{class:"wave",cx:L.mx,cy:MY,r:5});
 ui.ring={style:{}};
 mk("circle",{cx:L.mx,cy:MY,r:6,fill:"var(--bg)",stroke:"var(--hub)","stroke-width":2});
 mk("circle",{cx:L.mx,cy:MY,r:2.2,fill:"var(--hub)"});
 mk("path",{class:"out",d:`M${L.mx+9} ${MY} L${L.ox} ${MY}`});
 // combined
 const big=tall?28:40;
 mk("text",{class:"cl",x:L.end,y:MY-(tall?16:26),"text-anchor":"end"}).textContent="COMBINED";
 const t=mk("text",{class:"cv",x:L.end,y:MY+(tall?big+10:big-4),"text-anchor":"end",style:`font-size:${big}px`});
 ui.cv=mk("tspan",{},t);ui.cu=mk("tspan",{class:"un",dx:5,style:`font-size:${tall?12:16}px`},t);ui.cu.textContent="Mbps";
 ui.cg=mk("text",{class:"cg",x:L.end,y:MY+(tall?big+30:big+22),"text-anchor":"end"});
 render();
}

function render(){
 let total=0;
 links.forEach(l=>{l.r=Math.round(l.v);total+=l.r;
  l.sv.textContent=fmt(l.r);
  if(l.flow){const q=l.r/l.max;l.flow.style.strokeWidth=(1.6+q*2.6).toFixed(2);l.flow.style.opacity=(.45+q*.55).toFixed(2)}});
 ui.cv.textContent=fmt(total);
 ui.cg.textContent=(total/1000).toFixed(2)+" Gbps · "+Math.round(total/CAP*100)+"% capacity";
 ui.ring.style.strokeDashoffset=RC*(1-total/CAP);
}
function step(){links.forEach(l=>{l.v=Math.min(l.max,Math.max(l.min,l.v+(Math.random()-.5)*(l.max-l.min)*.12))});render()}

build();setInterval(step,1000);
addEventListener("resize",()=>{if((innerWidth/innerHeight<.85?"t":"w")!==mode)build()});
</script>
</body>
</html>
